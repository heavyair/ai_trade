services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_trade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_trade
      POSTGRES_USER: ai_trade
      POSTGRES_PASSWORD: ai_trade
    volumes:
      - /opt/ai_trade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_trade -d ai_trade"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ai_trade:latest
    container_name: ai_trade
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ai_trade:ai_trade@postgres:5432/ai_trade
      AKSHARE_PYTHON: /opt/akshare-venv/bin/python
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-AI Trade <noreply@lesminis.ca>}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://172.105.9.107}"
    ports:
      - "80:3000"
    volumes:
      - /opt/ai_trade_data:/app/data
